name: Build JAR
on:
  workflow_dispatch:
  push:
    branches: ["**"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          if [ -f src.zip ]; then
            unzip -o src.zip -d src_tmp
            if [ -d src_tmp/src ]; then
              mkdir -p src
              cp -rn src_tmp/src/* src/ || true
            else
              mkdir -p src
              cp -rn src_tmp/* src/ || true
            fi
            rm -rf src_tmp
          fi
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: build/libs/*.jar
